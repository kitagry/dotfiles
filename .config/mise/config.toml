# mdcat is in neither the mise nor the aqua registry. BIRSAx2/mdcat (the
# maintained successor of the archived swsnr/mdcat) ships Linux binaries only,
# and building it with cargo on Linux needs OpenSSL headers, so each OS gets
# its own backend. On macOS the curl crate links the system libcurl, so cargo
# needs nothing beyond rust.
"github:BIRSAx2/mdcat" = { version = "latest", os = ["linux"] }
"cargo:mdcat" = { version = "latest", os = ["macos"] }

[settings]
idiomatic_version_file_enable_tools = ["terraform"]
experimental = true
# node is provided by home-manager
