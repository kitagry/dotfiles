# kitty のデフォルトは ctrl+shift+click のみで ctrl+click は未割り当てのため、
# 他ターミナル (VSCode / GNOME Terminal) の流儀に合わせて ctrl+click でも URL を開く
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
# grabbed (tmux / nvim がマウスを掴んでいる) 時は press をアプリに渡すと誤作動するため捨てる
mouse_map ctrl+left press grabbed discard_event
